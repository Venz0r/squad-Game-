<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07030d">
<meta name="description" content="SQAD Game — Тольятти Ultimate Arcade & Auction">
<title>SQAD Game | Тольятти</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* SQAD ROYALE MULTIPLAYER FRONTEND */
const ROYALE_BETS=[10,25,50,100,250];
let royaleBet=10,royaleRoomCode='',royaleState=null,royalePoll=null,royaleBusy=false,royaleLastSpinRound=0,royaleLastSpinPoints=0,royaleLastSpinSymbols=[];
function royaleApi(action,extra={}){
  if(!tg?.initData) return Promise.reject(new Error('Telegram initData is empty'));
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),10000);
  return fetch(SQAD_BUILD.royaleUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData,action,...extra}),signal:controller.signal}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||('ROYALE_SERVER_'+r.status));return j;}).catch(e=>{if(e?.name==='AbortError')throw new Error('ROYALE_SERVER_TIMEOUT');throw e;}).finally(()=>clearTimeout(timeout));
}
function selectRoyaleBet(amount,el){if(royaleBusy)return;royaleBet=ROYALE_BETS.includes(Number(amount))?Number(amount):10;document.querySelectorAll('.royaleBet').forEach(x=>x.classList.toggle('active',Number(x.dataset.royaleBet)===royaleBet));haptic('light');}
function royaleUiMode(inRoom){document.getElementById('royaleLobby')?.classList.toggle('royaleHidden',inRoom);document.getElementById('royaleRoom')?.classList.toggle('royaleHidden',!inRoom);}
function royaleStatusText(status){return ({waiting:'Сбор тусовки',playing:'Баттл идёт',finished:'Итоги подведены',cancelled:'Комната закрыта',starting:'Запуск!'})[status]||status||'—';}
function royaleAvatar(p){return String(p?.avatar||p?.display_name||p?.username||'S').replace(/^@/,'').trim().charAt(0).toUpperCase()||'S';}
function royaleEscape(s){return escapeHTML(s??'');}
function royalePrizeFor(place,pot,count){pot=safeInt(pot);if(place===1)return Math.floor(pot*.7);if(place===2&&count>=3)return Math.floor(pot*.2);if(place===2&&count===2)return pot-Math.floor(pot*.7);if(place===3&&count>=3)return pot-Math.floor(pot*.7)-Math.floor(pot*.2);return 0;}
function royaleRenderPlayers(){
  const el=document.getElementById('royalePlayers');if(!el)return;const ps=Array.isArray(royaleState?.players)?royaleState.players:[];
  if(!ps.length){el.innerHTML='<div class="royaleEmpty">Ждем участников сквада…</div>';return;}
  el.innerHTML=ps.map(p=>{const ready=!!p.ready;const host=p.is_host?' 👑':'';return '<div class="royalePlayer '+(p.is_me?'me ':'')+(ready?'ready':'')+'"><div class="royaleReadyDot '+(ready?'on':'')+'"></div><div class="royaleAvatar">'+royaleEscape(royaleAvatar(p))+'</div><div class="royalePlayerMain"><div class="royalePlayerName">'+royaleEscape(p.display_name||p.username||'Участник')+(p.is_me?' <span style="color:#ff3fc8;font-size:9px">ТЫ</span>':'')+'<span class="royaleHost">'+host+'</span></div><div class="royalePlayerMeta">'+(ready?'ГОТОВ К ШОУ':'В ПОИСКЕ')+'</div></div><div class="royalePlayerScore">'+safeInt(p.total_score)+'<span style="display:block;color:#aa9ab9;font-size:8px">БАЛЛОВ</span>'+(p.place?'<span class="royalePlayerPlace">#'+p.place+'</span>':'')+'</div></div>'}).join('');
}
function royaleRenderTable(){
  const el=document.getElementById('royaleScoreTable');if(!el)return;const ps=[...(royaleState?.players||[])].sort((a,b)=>{if(a.place&&b.place)return a.place-b.place;if(a.place)return -1;if(b.place)return 1;return safeInt(b.total_score)-safeInt(a.total_score)});
  if(!ps.length){el.innerHTML='<div class="royaleEmpty">Таблица баттла появится здесь.</div>';return;}
  el.innerHTML='<div class="royaleTableRow head"><div>#</div><div>УЧАСТНИК</div><div style="text-align:right">БАЛЛЫ</div><div style="text-align:right">СТАТУС</div></div>'+ps.map((p,i)=>'<div class="royaleTableRow"><div class="place">'+(p.place||i+1)+'</div><div class="rname">'+royaleEscape(p.display_name||'Участник')+(p.is_me?' · ТЫ':'')+'</div><div class="rscore">'+safeInt(p.total_score)+'</div><div class="rstate">'+(p.place?'✓':'…')+'</div></div>').join('');
}
function royaleRenderFinal(){
  const box=document.getElementById('royaleFinal');if(!box)return;const r=royaleState?.room;if(!r||r.status!=='finished'){box.classList.add('royaleHidden');box.innerHTML='';return;}const me=(royaleState.players||[]).find(p=>p.is_me);const count=(royaleState.players||[]).length;const place=safeInt(me?.place);const prize=royalePrizeFor(place,safeInt(r.pot),count);const title=place===1?'ТЫ — ТОП-1 SQAD!':place?'БАТТЛ ЗАВЕРШЕН':'ИТОГИ БАТТЛА';box.classList.remove('royaleHidden');box.innerHTML='<div class="royaleFinal"><div class="royaleFinalCrown">'+(place===1?'🔥':'🏆')+'</div><div class="royaleFinalTitle">'+title+'</div><div class="royaleFinalMeta">Твое место в скваде</div><div class="royalePrize">#'+(place||'—')+'</div><div class="royaleFinalMeta">'+(prize?'Выигрыш: <b style="color:#ffd45c">+'+prize+'</b> баллов':'Без призовой выплаты')+' · Банк '+safeInt(r.pot)+'</div><button class="primary" style="margin-top:12px" onclick="royaleExitFinished()">В ЛОББИ SQAD</button></div>';
}
function royaleRender(){
  const r=royaleState?.room;if(!r){royaleUiMode(false);return;}
  royaleUiMode(true);setText('royaleRoomCode',r.code);setText('royaleRoomStatus',royaleStatusText(r.status));setText('royaleRoundNow',safeInt(r.current_round));setText('royalePot',formatPoints(r.pot));
  royaleRenderPlayers();royaleRenderTable();royaleRenderFinal();
  const ps=royaleState.players||[],me=ps.find(p=>p.is_me),host=!!me?.is_host,playing=r.status==='playing',waiting=r.status==='waiting',finished=r.status==='finished',already=royaleLastSpinRound===safeInt(r.current_round);
  const lobbyActions=document.getElementById('royaleLobbyActions');if(lobbyActions)lobbyActions.classList.toggle('royaleHidden',!waiting);
  const readyBtn=document.getElementById('royaleReadyBtn');if(readyBtn){readyBtn.textContent=me?.ready?'✕ НЕ ГОТОВ':'✓ ГОТОВ';readyBtn.disabled=royaleBusy||!waiting;}
  const startBtn=document.getElementById('royaleStartBtn');if(startBtn){startBtn.disabled=royaleBusy||!waiting||!host||ps.length<2||!ps.every(p=>p.ready);startBtn.textContent=host?'🔥 СТАРТ БАТТЛА':'🔒 ЖДЕМ ХОСТА';}
  const play=document.getElementById('royalePlayArea');if(play)play.classList.toggle('royaleHidden',!playing);
  const spinBtn=document.getElementById('royaleSpinBtn');if(spinBtn){spinBtn.disabled=royaleBusy||already;spinBtn.textContent=already?'✓ ХОД СДЕЛАН':'🎰 КРУТИТЬ SQAD';}
  const wait=document.getElementById('royaleSpinWait');if(wait){const done=(royaleState.current_results||[]).length;wait.textContent=alreadyText(done,ps.length,already);}
  const leave=document.getElementById('royaleLeaveBtn');if(leave)leave.textContent=finished?'← ЗАКРЫТЬ ИТОГИ':'← ВЫЙТИ ИЗ КОМНАТЫ';
  if(finished&&royaleLastSpinRound>0) setText('royaleSpinInfo','🏁 Баттл завершен!');
  if(r.status==='cancelled')setText('royaleSpinInfo','Комната распущена');
  setText('royaleLobbyBalance',formatPoints(data.score));
}
function alreadyText(done,total,already){if(already)return 'Твой ход принят. Ждем остальных участников…';if(done>=total&&total)return 'Все сделали ходы — переходим к следующему раунду!';return 'Сделали ходы в раунде: '+done+' / '+total;}
async function royaleRefresh(){
  if(!royaleRoomCode)return;try{const r=await royaleApi('royale_state',{room_code:royaleRoomCode});royaleState=r;royaleRender();}catch(e){if(['ROOM_NOT_FOUND','NOT_IN_ROOM'].includes(e.message)){royaleStopPolling();royaleRoomCode='';royaleState=null;royaleUiMode(false);if(currentScreen==='royale')toast('Комната закрыта');}else console.warn('Royale state:',e.message)}
}
function royaleStartPolling(){clearInterval(royalePoll);royalePoll=setInterval(()=>{if(currentScreen==='royale'&&royaleRoomCode&&!royaleBusy)royaleRefresh()},1500)}
function royaleStopPolling(){clearInterval(royalePoll);royalePoll=null}
async function royaleCreate(){if(royaleBusy)return;royaleBusy=true;const btn=document.getElementById('royaleCreateBtn');if(btn)btn.disabled=true;try{const r=await royaleApi('royale_create',{bet:royaleBet});royaleState=r;royaleRoomCode=r.room?.code||'';royaleLastSpinRound=0;royaleLastSpinPoints=0;royaleLastSpinSymbols=[];data.score=Math.max(0,data.score-royaleBet);updateUI();royaleRender();royaleStartPolling();toast('🔥 Создана комната SQAD: '+royaleRoomCode);haptic('medium');}catch(e){royaleShowError(e);toast('⚠️ '+royaleHumanError(e.message));}finally{royaleBusy=false;if(btn)btn.disabled=false;}}
async function royaleJoin(){if(royaleBusy)return;const code=(document.getElementById('royaleJoinCode')?.value||'').trim().toUpperCase();if(code.length!==6)return toast('Введи 6-значный код комнаты');royaleBusy=true;try{const r=await royaleApi('royale_join',{room_code:code});royaleState=r;royaleRoomCode=r.room?.code||code;royaleLastSpinRound=0;data.score=Math.max(0,data.score-safeInt(r.room?.bet));updateUI();royaleRender();royaleStartPolling();toast('🎮 Ты в скваде комнаты '+royaleRoomCode);haptic('medium');}catch(e){royaleShowError(e);toast('⚠️ '+royaleHumanError(e.message));}finally{royaleBusy=false;}}
async function royaleToggleReady(){if(royaleBusy||!royaleRoomCode)return;const me=(royaleState?.players||[]).find(p=>p.is_me);royaleBusy=true;try{const r=await royaleApi('royale_ready',{room_code:royaleRoomCode,ready:!me?.ready});royaleState=r;royaleRender();haptic('light');}catch(e){royaleShowError(e);toast('⚠️ '+royaleHumanError(e.message));}finally{royaleBusy=false;royaleRender();}}
async function royaleStart(){if(royaleBusy||!royaleRoomCode)return;royaleBusy=true;try{const r=await royaleApi('royale_start',{room_code:royaleRoomCode});royaleState=r;royaleLastSpinRound=0;royaleRender();toast('🚀 Баттл SQAD начался!');haptic('heavy');}catch(e){royaleShowError(e);toast('⚠️ '+royaleHumanError(e.message));}finally{royaleBusy=false;royaleRender();}}
async function royaleSpin(){if(royaleBusy||!royaleRoomCode||royaleState?.room?.status!=='playing')return;const round=safeInt(royaleState.room.current_round);if(royaleLastSpinRound===round)return;royaleBusy=true;const btn=document.getElementById('royaleSpinBtn');if(btn)btn.disabled=true;setText('royaleSpinInfo','🎲 Крутим барабан SQAD…');try{const r=await royaleApi('royale_spin',{room_code:royaleRoomCode});const sp=r.spin||{};royaleLastSpinRound=round;royaleLastSpinPoints=safeInt(sp.points);royaleLastSpinSymbols=Array.isArray(sp.symbols)?sp.symbols:[];royaleState=r;await royaleAnimateSpin(royaleLastSpinSymbols);setText('royaleSpinInfo',(royaleLastSpinPoints>=25?'🔥 ОГОНЬ!':'✨')+' +'+royaleLastSpinPoints+' баллов');haptic('medium');royaleRender();}catch(e){if(e.message==='ALREADY_SPUN')royaleLastSpinRound=round;royaleShowError(e);toast('⚠️ '+royaleHumanError(e.message));}finally{royaleBusy=false;royaleRender();}}
async function royaleAnimateSpin(symbols){const ids=['rr1','rr2','rr3'];const fallback=['🔥','🎟️','🎧'];for(let k=0;k<8;k++){ids.forEach((id,i)=>setText(id,fallback[(i+k)%fallback.length]));await new Promise(r=>setTimeout(r,45));}ids.forEach((id,i)=>setText(id,symbols[i]||fallback[i]));ids.forEach(id=>document.getElementById(id)?.classList.add('flash'));setTimeout(()=>ids.forEach(id=>document.getElementById(id)?.classList.remove('flash')),520);}
async function royaleLeave(){if(!royaleRoomCode)return;const finished=royaleState?.room?.status==='finished';if(finished)return royaleExitFinished();if(royaleBusy)return;royaleBusy=true;try{const r=await royaleApi('royale_leave',{room_code:royaleRoomCode});if(r.refunded){data.score+=safeInt(r.refunded);updateUI();toast('↩️ Возвращено '+r.refunded+' баллов');}royaleStopPolling();royaleRoomCode='';royaleState=null;royaleLastSpinRound=0;royaleUiMode(false);openScreen('royale');}catch(e){royaleShowError(e);toast('⚠️ '+royaleHumanError(e.message));}finally{royaleBusy=false;}}
function royaleExitFinished(){royaleStopPolling();royaleRoomCode='';royaleState=null;royaleLastSpinRound=0;royaleUiMode(false);document.getElementById('royaleFinal')?.classList.add('royaleHidden');document.getElementById('royaleError')?.classList.add('royaleHidden');updateUI();}
function copyRoyaleCode(){const code=royaleState?.room?.code||royaleRoomCode;if(!code)return;const done=()=>toast('📋 Код сквада '+code+' скопирован');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(code).then(done).catch(()=>royaleCopyFallback(code));else royaleCopyFallback(code);}
function royaleCopyFallback(code){const t=document.createElement('textarea');t.value=code;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('📋 Код '+code+' скопирован')}catch(e){toast('Код: '+code)}t.remove();}
function royaleHumanError(e){return ({ROYALE_SERVER_TIMEOUT:'Сервер SQAD не отвечает.',INVALID_ROYALE_BET:'Неверная ставка.',INSUFFICIENT_POINTS:'Недостаточно баллов SQAD.',ROOM_NOT_FOUND:'Комната не найдена.',ROOM_NOT_JOINABLE:'В эту комнату уже нельзя войти.',ROOM_FULL:'Комната заполнена (макс 8).',NEED_TWO_PLAYERS:'Нужно минимум 2 игрока.',PLAYERS_NOT_READY:'Не все готовы.',ONLY_HOST_CAN_START:'Только создатель может запустить баттл.',ROOM_ALREADY_STARTED:'Баттл уже идет.',ALREADY_SPUN:'Ты уже сделал ход в этом раунде.',ROOM_NOT_PLAYING:'Баттл не активен.',ROOM_NOT_WAITING:'Комната уже стартовала.',NOT_IN_ROOM:'Ты вышел из комнаты.',ROOM_CODE_FAILED:'Не удалось создать код.'}[e])||e||'Ошибка SQAD Royale.';}
function royaleShowError(e){const el=document.getElementById('royaleError');if(!el)return;el.classList.remove('royaleHidden');el.innerHTML='<div class="royaleError">⚠️ '+royaleEscape(royaleHumanError(e.message))+'</div>';clearTimeout(royaleShowError._t);royaleShowError._t=setTimeout(()=>el.classList.add('royaleHidden'),4500);}
function royalePatchOpenScreen(){
  const original=openScreen;
  openScreen=function(id){if(currentScreen==='royale'&&id!=='royale')royaleStopPolling();original(id);if(id==='royale'){setText('royaleLobbyBalance',formatPoints(data.score));if(royaleRoomCode){royaleUiMode(true);royaleRefresh();royaleStartPolling()}else royaleUiMode(false);}}
}
</script>
<style>

#app{display:none;min-height:100vh;background:radial-gradient(circle at 50% -10%,#32124b 0,#10071a 38%,var(--bg) 75%)}.wrap{width:min(100%,620px);margin:auto;padding:12px 14px 100px}
.header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px 16px;position:sticky;top:0;z-index:40;background:linear-gradient(#07030de8,#07030d00);backdrop-filter:blur(10px)}
.brand{font-weight:950;font-size:22px;letter-spacing:-.5px;color:var(--text);text-shadow:0 0 18px rgba(255,63,200,0.3)}.brand small{display:block;color:var(--pink);font-size:9px;letter-spacing:2px;margin-top:1px}
.user{display:flex;align-items:center;gap:8px;background:linear-gradient(145deg,#1b0b2d,#12081f);border:1px solid var(--line);padding:7px 10px;border-radius:15px;box-shadow:0 8px 25px rgba(0,0,0,0.5)}
.avatar,.bigavatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;font-weight:900;box-shadow:0 0 25px rgba(155,92,255,0.3)}
.uname{font-size:12px;font-weight:800;max-width:145px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.screen{display:none;animation:in .2s ease}.screen.active{display:block}
.hero{background:linear-gradient(145deg,#24103d 0,#12071e 62%,#0d0615 100%);border:1px solid #543077;border-radius:24px;padding:20px;box-shadow:0 22px 70px rgba(0,0,0,0.8);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,79,207,0.15);right:-80px;top:-80px;filter:blur(4px)}
.eyebrow{color:var(--pink);font-size:10px;font-weight:900;letter-spacing:2px}
.h1{font-size:31px;line-height:1.03;font-weight:950;margin:8px 0;letter-spacing:-1.2px;color:var(--text)}
.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.stat{background:#0c0514cc;border:1px solid #3d1e58;border-radius:15px;padding:11px;box-shadow:inset 0 1px rgba(255,255,255,0.04)}
.stat b{display:block;font-size:19px;color:#fff}
.stat span{font-size:10px;color:var(--muted)}
.grid,.arcadeGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

.mode:hover{border-color:var(--pink);box-shadow:0 0 0 1px rgba(255,63,200,0.2),0 18px 40px rgba(0,0,0,0.6)}

.sectionTitle{font-size:17px;font-weight:900;margin:18px 2px 9px;color:var(--text);letter-spacing:-.2px}
.gamecard{background:linear-gradient(145deg,#21102f,#0e0615);border:1px solid #4b2867;border-radius:24px;padding:18px;text-align:center;box-shadow:0 20px 55px rgba(0,0,0,0.7)}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.reel{height:98px;border-radius:18px;background:radial-gradient(circle at 50% 35%,#24132f,#08030d 70%);border:1px solid #4c2866;display:grid;place-items:center;font-size:45px;box-shadow:inset 0 0 30px #000,0 8px 20px rgba(0,0,0,0.3)}
.target{background:#17101d;border:1px solid #51315e;border-radius:14px;padding:10px;margin:8px 0;color:#fff}
.primary{width:100%;padding:14px 16px;border-radius:15px;background:linear-gradient(100deg,var(--violet),var(--pink));color:#fff;font-weight:950;box-shadow:0 12px 32px rgba(155,92,255,0.3);letter-spacing:.4px}

.secondary{padding:11px 14px;border-radius:13px;background:#1d0d2b;border:1px solid #4a2864;font-weight:800;color:#fff}
.result{min-height:27px;font-weight:900;color:var(--gold);margin:9px}
.timer{font-size:42px;font-weight:950;margin:5px;color:var(--cyan)}
.bigscore{font-size:34px;font-weight:950;color:var(--pink)}
.profile{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;background:linear-gradient(145deg,#1b0c29,#0f0617);border:1px solid #4b2867;border-radius:22px;padding:16px}
.bigavatar{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;font-size:28px;box-shadow:0 10px 28px rgba(155,92,255,0.3)}
.levelbar{height:8px;background:#271335;border-radius:99px;overflow:hidden;margin-top:8px}
.levelbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));width:0}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#130822;border:1px solid #301544;border-radius:15px;padding:12px}
.rank{width:28px;text-align:center;font-weight:950;color:var(--gold)}
.rowmain{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.mini{width:32px;height:32px;border-radius:10px;background:#2b1240;display:grid;place-items:center}
.rowname{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>
// Автоматический запуск Telegram WebApp и скрытие прелоадера
window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
        const loading = document.getElementById('loading');
        if (loading) {
            loading.style.opacity = '0';
            setTimeout(() => loading.remove(), 450);
        }
        const app = document.getElementById('app');
        if (app) app.style.display = 'block';
        
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    }, 800);
});
</script>
